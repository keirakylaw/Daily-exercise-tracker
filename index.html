<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30天爬樓機訓練計劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- 頂部標題與總進度 -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3.5">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h1 class="text-lg font-bold tracking-wide">🔥 30天爬樓機訓練計劃</h1>
                    <p id="saveStatus" class="text-[11px] text-orange-100 mt-0.5">● 已自動保存於本機</p>
                </div>
                <button onclick="resetData()" class="text-xs bg-white/20 hover:bg-white/30 active:scale-95 px-2.5 py-1 rounded-full transition font-medium">重設</button>
            </div>
            
            <!-- 進度條 -->
            <div class="bg-black/15 rounded-full h-3 overflow-hidden mb-1.5 p-0.5">
                <div id="progressBar" class="bg-white h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            
            <div class="flex justify-between text-xs font-medium text-orange-50">
                <span id="progressText">已完成 0 / 30 天 (0%)</span>
                <span id="totalSteps">累積: 0 / 38,100 步</span>
            </div>
        </div>

        <!-- 導航分頁列 -->
        <div class="bg-orange-600/40 px-4 py-1.5 flex gap-2 border-t border-orange-400/30">
            <button onclick="switchTab('tracker')" id="tab-tracker" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-orange-600 shadow-sm transition">🔥 訓練打卡</button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-white hover:bg-white/10 transition">📅 日曆檢視</button>
            <button onclick="switchTab('archive')" id="tab-archive" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-white hover:bg-white/10 transition">📁 歷史紀錄</button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 mt-4">
        
        <!-- 分頁 1：打卡清單 -->
        <div id="view-tracker" class="space-y-3">
            <div class="flex justify-between items-center bg-white p-2.5 rounded-xl shadow-sm border border-slate-100">
                <div class="flex gap-1.5">
                    <button onclick="filterDays('all')" id="btn-all" class="text-xs px-3 py-1.5 rounded-lg font-medium bg-orange-500 text-white transition">全部 (30)</button>
                    <button onclick="filterDays('active')" id="btn-active" class="text-xs px-3 py-1.5 rounded-lg font-medium bg-slate-100 text-slate-600 transition">未完成</button>
                </div>
                <button onclick="exportCSV()" class="text-xs bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                    📥 匯出CSV
                </button>
            </div>

            <!-- 新周期按鈕（當完成30天時顯示） -->
            <div id="newCycleBanner" class="hidden bg-gradient-to-r from-emerald-500 to-teal-500 text-white p-4 rounded-xl shadow-md text-center">
                <h3 class="font-bold text-base mb-1">🎉 恭喜完成本輪 30 天訓練！</h3>
                <p class="text-xs text-emerald-100 mb-3">你可以將本輪數據歸檔保存，並開始全新一輪的挑戰！</p>
                <button onclick="startNewCycle()" class="bg-white text-emerald-700 font-bold px-4 py-2 rounded-lg text-xs shadow hover:bg-emerald-50 transition active:scale-95">
                    🚀 開始新的一個周期
                </button>
            </div>

            <p class="text-[11px] text-slate-400 px-1 flex justify-between">
                <span>👆 點擊左側圓圈打卡並自動記錄日期</span>
                <span>📅 點擊右側日期可微調</span>
            </p>

            <div id="dayList" class="space-y-2.5"></div>
        </div>

        <!-- 分頁 2：日曆檢視 -->
        <div id="view-calendar" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <!-- 日曆標題控制 -->
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold">◀ 上月</button>
                    <h2 id="calendarMonthTitle" class="font-bold text-slate-700 text-base">2026年11月</h2>
                    <button onclick="changeMonth(1)" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold">下月 ▶</button>
                </div>

                <!-- 星期標題 -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>

                <!-- 日曆格子 -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
            </div>

            <!-- 當日詳情卡片 -->
            <div id="calendarDayDetail" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-bold text-slate-400 mb-1">📅 點擊上方日曆日期查看記錄</h3>
                <p class="text-sm text-slate-600">請點選日曆中有打卡標記的日子以查看詳情。</p>
            </div>
        </div>

        <!-- 分頁 3：歷史紀錄 -->
        <div id="view-archive" class="hidden space-y-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-3 flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-700 text-sm mb-0.5">📁 歷史訓練周期存檔</h2>
                    <p class="text-xs text-slate-400">可隨時檢視詳情、改名或刪除紀錄（同步更新日曆）。</p>
                </div>
                <button onclick="toggleArchiveEditMode()" id="btn-archive-edit" class="text-xs px-3 py-1.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition shrink-0">
                    ✏️ 編輯管理
                </button>
            </div>
            <div id="archiveList" class="space-y-3">
                <!-- 動態加載 -->
            </div>
        </div>

    </main>

    <!-- 歷史紀錄詳情彈窗 (Modal) -->
    <div id="archiveDetailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white rounded-2xl max-w-md w-full max-h-[80vh] flex flex-col shadow-xl overflow-hidden">
            <div class="p-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-base">周期詳情</h3>
                <button onclick="closeArchiveModal()" class="text-white/80 hover:text-white text-xl font-bold px-2">&times;</button>
            </div>
            <div id="modalBody" class="p-4 overflow-y-auto space-y-2 text-xs">
                <!-- 動態填入30天明細 -->
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 text-right">
                <button onclick="closeArchiveModal()" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const planData = [
            { day: 1, type: 'steps', count: 1000 }, { day: 2, type: 'steps', count: 1100 }, { day: 3, type: 'rest', count: 0 },
            { day: 4, type: 'steps', count: 1200 }, { day: 5, type: 'steps', count: 1300 }, { day: 6, type: 'rest', count: 0 },
            { day: 7, type: 'steps', count: 1400 }, { day: 8, type: 'steps', count: 1500 }, { day: 9, type: 'rest', count: 0 },
            { day: 10, type: 'steps', count: 1600 }, { day: 11, type: 'steps', count: 1700 }, { day: 12, type: 'rest', count: 0 },
            { day: 13, type: 'steps', count: 1800 }, { day: 14, type: 'steps', count: 1900 }, { day: 15, type: 'rest', count: 0 },
            { day: 16, type: 'steps', count: 2000 }, { day: 17, type: 'steps', count: 2000 }, { day: 18, type: 'rest', count: 0 },
            { day: 19, type: 'steps', count: 2100 }, { day: 20, type: 'steps', count: 2200 }, { day: 21, type: 'rest', count: 0 },
            { day: 22, type: 'steps', count: 2300 }, { day: 23, type: 'steps', count: 2400 }, { day: 24, type: 'rest', count: 0 },
            { day: 25, type: 'steps', count: 2500 }, { day: 26, type: 'steps', count: 2600 }, { day: 27, type: 'rest', count: 0 },
            { day: 28, type: 'steps', count: 2700 }, { day: 29, type: 'steps', count: 2800 }, { day: 30, type: 'rest', count: 0 }
        ];

        const STORAGE_KEY_CURRENT = 'stair_stepper_current_v2';
        const STORAGE_KEY_ARCHIVE = 'stair_stepper_archives_v2';
        
        let currentFilter = 'all';
        let currentTab = 'tracker';
        let isArchiveEditMode = false;
        
        // 日曆檢視用變數
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth(); // 0-11

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY_CURRENT);
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            let initial = {};
            planData.forEach(item => { initial[item.day] = { completed: false, date: '' }; });
            return initial;
        }

        function loadArchives() {
            const saved = localStorage.getItem(STORAGE_KEY_ARCHIVE);
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return [];
        }

        let progressState = loadProgress();
        let archiveList = loadArchives();

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(progressState));
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('saveStatus').innerText = `● 已自動保存 (${timeStr})`; }  function saveArchives() { localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(archiveList)); }  function getTodayString() { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        // 分頁切換
        function switchTab(tab) {
            currentTab = tab;
            ['tracker', 'calendar', 'archive'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab); const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-orange-600 shadow-sm transition";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-white hover:bg-white/10 transition";
                }
            });
            if (tab === 'calendar') renderCalendar();
            if (tab === 'archive') renderArchives();
        }

        function toggleDay(dayNum) {
            const state = progressState[dayNum];
            if (!state.completed) {
                state.completed = true;
                state.date = getTodayString();
            } else {
                state.completed = false;
                state.date = '';
            }
            saveProgress();
            renderTracker();
        }

        function updateDate(dayNum, newDate) {
            if (progressState[dayNum].completed) {
                progressState[dayNum].date = newDate;
                saveProgress();
            }
        }

        function filterDays(filter) {
            currentFilter = filter;
            document.getElementById('btn-all').className = `text-xs px-3 py-1.5 rounded-lg font-medium transition ${filter === 'all' ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'}`;
            document.getElementById('btn-active').className = `text-xs px-3 py-1.5 rounded-lg font-medium transition ${filter === 'active' ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'}`; renderTracker(); }  // 開始新周期（歸檔當前） function startNewCycle() { if (confirm("確定要將當前周期歸檔，並開始新的一輪 30 天訓練嗎？")) { let completedCount = 0; let totalStepsCount = 0; planData.forEach(item => { if (progressState[item.day]?.completed) { completedCount++; if (item.type === 'steps') totalStepsCount += item.count; } });  const archiveItem = { id: Date.now(), title: `第 ${archiveList.length + 1} 輪周期`,
                    endDate: getTodayString(),
                    completedCount: completedCount,
                    totalSteps: totalStepsCount,
                    records: JSON.parse(JSON.stringify(progressState))
                };

                archiveList.unshift(archiveItem);
                saveArchives();

                // 重置當前清單
                let initial = {};
                planData.forEach(item => { initial[item.day] = { completed: false, date: '' }; });
                progressState = initial;
                saveProgress();
                renderTracker();
                alert("已成功歸檔！新周期已準備就緒。");
            }
        }

        function updateDashboard() {
            let completedCount = 0;
            let totalStepsCount = 0;
            planData.forEach(item => {
                if (progressState[item.day] && progressState[item.day].completed) {
                    completedCount++;
                    if (item.type === 'steps') totalStepsCount += item.count;
                }
            });
            const percent = Math.round((completedCount / 30) * 100);
            document.getElementById('progressBar').style.width = `${percent}\%`; document.getElementById('progressText').innerText = `已完成 ${completedCount} / 30 天 (${percent}\%)`; document.getElementById('totalSteps').innerText = `累積: ${totalStepsCount.toLocaleString()} / 38,100 步`;

            // 顯示或隱藏新周期橫幅
            const banner = document.getElementById('newCycleBanner');
            if (completedCount >= 30) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        function renderTracker() {
            updateDashboard();
            const listEl = document.getElementById('dayList');
            listEl.innerHTML = '';

            let nextDay = planData.find(d => !progressState[d.day]?.completed)?.day;

            planData.forEach(item => {
                const state = progressState[item.day] || { completed: false, date: '' };
                if (currentFilter === 'active' && state.completed) return;

                const isRest = item.type === 'rest';
                const isNext = item.day === nextDay && !state.completed;
                const card = document.createElement('div');
                
                card.className = `flex items-center justify-between p-3 rounded-xl border transition-all ${
                    state.completed 
                        ? 'bg-emerald-50/90 border-emerald-200 shadow-sm' 
                        : isNext
                            ? 'bg-orange-50/40 border-orange-300 shadow-sm'
                            : isRest 
                                ? 'bg-slate-100/70 border-slate-200' 
                                : 'bg-white border-slate-200 shadow-sm'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer flex-grow select-none" onclick="toggleDay(${item.day})">
                        <div class="w-6 h-6 rounded-full flex items-center justify-center border-2 transition-colors ${
                            state.completed 
                                ? 'bg-emerald-500 border-emerald-500 text-white' 
                                : isNext ? 'border-orange-400 bg-white' : 'border-slate-300 bg-white'
                        }">
                            ${state.completed ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </div>
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-slate-700 text-sm ${state.completed ? 'line-through text-slate-400' : ''}">第 ${item.day} 天</span>
                                <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${
                                    isRest 
                                        ? 'bg-slate-200 text-slate-600' 
                                        : 'bg-orange-100 text-orange-700'
                                }">
                                    ${isRest ? '😴 休息日' : `🔥 ${item.count.toLocaleString()} 步`}
                                </span>
                                ${isNext ? '<span class="text-[10px] px-1 py-0.5 rounded bg-orange-500 text-white font-bold">今日目標</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center">
                        ${state.completed 
                            ? `<input type="date" value="${state.date}" class="text-xs text-emerald-700 font-medium bg-emerald-100/70 border border-emerald-200 rounded-lg px-2 py-1 focus:outline-none" onchange="updateDate(${item.day}, this.value)" onclick="event.stopPropagation()">`
                            : `<span class="text-xs text-slate-300 pr-1">未完成</span>`
                        }
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // 📅 日曆邏輯（即時讀取 progressState 與 archiveList，刪除存檔會即時同步消失）
        function changeMonth(direction) {
            calMonth += direction;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            if (calMonth < 0) { calMonth = 11; calYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calendarMonthTitle').innerText = `${calYear}年 ${calMonth + 1}月`;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            let dateMap = {};
            
            // 1. 整理當前周期記錄
            planData.forEach(item => {
                const st = progressState[item.day];
                if (st && st.completed && st.date) {
                    if (!dateMap[st.date]) dateMap[st.date] = [];
                    dateMap[st.date].push({ cycle: '當前周期', day: item.day, count: item.count, type: item.type });
                }
            });

            // 2. 整理未被刪除的歷史存檔記錄
            archiveList.forEach(arc => {
                planData.forEach(item => {
                    const st = arc.records[item.day];
                    if (st && st.completed && st.date) {
                        if (!dateMap[st.date]) dateMap[st.date] = [];
                        dateMap[st.date].push({ cycle: arc.title, day: item.day, count: item.count, type: item.type });
                    }
                });
            });

            const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
            const totalDays = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-10";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${calYear}-${String(calMonth + 1).padStart
